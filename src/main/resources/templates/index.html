<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board - Project Management</title>
    <meta name="description" content="Modern Kanban board for efficient project management and task tracking">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            background: #f3f4f6 !important;
        }
    </style>
</head>
<body class="main-page">
    
    <div class="container-fluid">
        <header class="py-4 mb-4">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h1 class="mb-1"><i class="fas fa-tasks me-3"></i>Kanban Board</h1>
                    <p class="text-muted mb-0">Organize your tasks efficiently</p>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-secondary" onclick="refreshBoard()" title="Refresh Board">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                    <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#taskModal">
                        <i class="fas fa-plus me-2"></i>Add Task
                    </button>
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-danger" title="Logout">
                            <i class="fas fa-sign-out-alt"></i>
                        </button>
                    </form>
                </div>
            </div>
        </header>
        
        <!-- Stats Cards -->
        <div class="row mb-4">
            <div class="col-md-3 col-sm-6 mb-3" th:each="column : ${columns}">
                <div class="stats-card">
                    <div class="stats-icon">
                        <i class="fas fa-list-ul"></i>
                    </div>
                    <div class="stats-content">
                        <h3 th:text="${tasksGrouped[column.name]?.size() ?: 0}">0</h3>
                        <p th:text="${column.name}">Column</p>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="kanban-board" id="kanbanBoard">
            <div th:each="column : ${columns}" class="kanban-column" th:data-column-id="${column.columnId}">
                <div class="column-header">
                    <h4 th:text="${column.name}"></h4>
                    <span class="badge bg-secondary" th:text="${tasksGrouped[column.name]?.size() ?: 0}"></span>
                </div>
                <div class="tasks-container" ondrop="drop(event)" ondragover="allowDrop(event)">
                    <!-- Tasks -->
                    <div th:each="task : ${tasksGrouped[column.name]}" 
                         class="task-card" 
                         draggable="true" 
                         ondragstart="drag(event)"
                         th:data-task-id="${task.taskId}"
                         role="button"
                         tabindex="0">
                        <div class="task-header">
                            <h6 th:text="${task.title}" class="task-title"></h6>
                            <span class="priority-badge" 
                                  th:classappend="'priority-' + ${task.priority.name().toLowerCase()}" 
                                  th:text="${task.priority}"
                                  th:title="'Priority: ' + ${task.priority}"></span>
                        </div>
                        <p class="task-description" th:text="${task.description}" th:if="${task.description}"></p>
                        <div class="task-meta">
                            <div class="task-user">
                                <i class="fas fa-user-circle me-1"></i>
                                <small th:text="${task.user.name}"></small>
                            </div>
                            <div class="task-date">
                                <i class="fas fa-clock me-1"></i>
                                <small th:text="${#temporals.format(task.createdAt, 'MMM dd')}"></small>
                            </div>
                        </div>
                        <div class="task-footer">
                            <div class="task-actions">
                                <button class="btn btn-sm btn-outline-primary" 
                                        onclick="editTask(this)" 
                                        th:data-task-id="${task.taskId}"
                                        title="Edit Task"
                                        aria-label="Edit Task">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-danger" 
                                        onclick="deleteTask(this)" 
                                        th:data-task-id="${task.taskId}"
                                        title="Delete Task"
                                        aria-label="Delete Task">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Empty State -->
                    <div th:if="${tasksGrouped[column.name] == null or tasksGrouped[column.name].isEmpty()}" 
                         class="empty-column">
                        <i class="fas fa-inbox"></i>
                        <p>No tasks yet</p>
                        <small class="text-muted">Drag tasks here or create new ones</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Task Modal -->
    <div class="modal fade" id="taskModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Task</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="taskForm" novalidate>
                        <div class="mb-3">
                            <label for="taskTitle" class="form-label">
                                <i class="fas fa-heading me-2"></i>Title *
                            </label>
                            <input type="text" 
                                   class="form-control" 
                                   id="taskTitle" 
                                   placeholder="Enter task title"
                                   required
                                   maxlength="100">
                            <div class="invalid-feedback">
                                Please provide a task title.
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="taskDescription" class="form-label">
                                <i class="fas fa-align-left me-2"></i>Description
                            </label>
                            <textarea class="form-control" 
                                      id="taskDescription" 
                                      rows="3"
                                      placeholder="Enter task description (optional)"
                                      maxlength="500"></textarea>
                            <div class="form-text">Optional: Provide additional details about the task</div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="taskUser" class="form-label">
                                    <i class="fas fa-user me-2"></i>Assigned User *
                                </label>
                                <select class="form-select" id="taskUser" required>
                                    <option value="">Select User</option>
                                    <option th:each="user : ${users}" th:value="${user.userId}" th:text="${user.name}"></option>
                                </select>
                                <div class="invalid-feedback">
                                    Please select a user.
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="taskColumn" class="form-label">
                                    <i class="fas fa-columns me-2"></i>Column *
                                </label>
                                <select class="form-select" id="taskColumn" required>
                                    <option th:each="column : ${columns}" th:value="${column.columnId}" th:text="${column.name}"></option>
                                </select>
                                <div class="invalid-feedback">
                                    Please select a column.
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="taskPriority" class="form-label">
                                <i class="fas fa-flag me-2"></i>Priority *
                            </label>
                            <select class="form-select" id="taskPriority" required>
                                <option value="">Select Priority</option>
                                <option value="Low">🟢 Low Priority</option>
                                <option value="Medium">🟡 Medium Priority</option>
                                <option value="High">🔴 High Priority</option>
                            </select>
                            <div class="invalid-feedback">
                                Please select a priority level.
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times me-2"></i>Cancel
                    </button>
                    <button type="button" class="btn btn-primary" onclick="saveTask()">
                        <i class="fas fa-save me-2"></i>Save Task
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/kanban.js}"></script>
</body>
</html>
